paths:
  /me:
    get:
      operationId: getApiPrincipal
      tags:
        - Meta
      summary: Inspect the authenticated API key context
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Authenticated API key context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing, malformed, unknown, revoked, or expired API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited. Responses include Retry-After and rate-limit metadata where available.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying the request.
            RateLimit-Limit:
              schema:
                type: string
              description: Current route bucket limit.
            RateLimit-Remaining:
              schema:
                type: string
              description: Requests remaining in the current route bucket window.
            RateLimit-Reset:
              schema:
                type: string
              description: Seconds until the current route bucket resets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-hollyhr-domain-capabilities:
        - settings.api.manage
  /metadata:
    get:
      operationId: getApiMetadata
      tags:
        - Meta
      summary: Inspect the public API metadata catalogue
      description:
        Returns a generated machine-readable catalogue of routes, required scopes, query/path
        parameters, schema fields, scope field categories, and webhook event scope requirements. The
        catalogue is generated from the same OpenAPI/Zod contract source as the reference docs.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Public API metadata catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
        "401":
          description: Missing, malformed, unknown, revoked, or expired API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited. Responses include Retry-After and rate-limit metadata where available.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying the request.
            RateLimit-Limit:
              schema:
                type: string
              description: Current route bucket limit.
            RateLimit-Remaining:
              schema:
                type: string
              description: Requests remaining in the current route bucket window.
            RateLimit-Reset:
              schema:
                type: string
              description: Seconds until the current route bucket resets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-hollyhr-domain-capabilities:
        - settings.api.manage
  /organisation:
    get:
      operationId: getOrganisation
      tags:
        - Organisation
      summary: Fetch organisation account details
      description:
        Fetches safe company/account details for the authenticated organisation. The projection
        excludes owner user ids, created/updated user ids, custom-domain provider configuration,
        verification payloads, and other internal tenant infrastructure fields.
      security:
        - ApiKeyAuth: []
      x-required-scope: organisation:read
      responses:
        "200":
          description: Safe organisation account projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, unknown, revoked, or expired API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing scope or plan entitlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organisation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited. Responses include Retry-After and rate-limit metadata where available.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying the request.
            RateLimit-Limit:
              schema:
                type: string
              description: Current route bucket limit.
            RateLimit-Remaining:
              schema:
                type: string
              description: Requests remaining in the current route bucket window.
            RateLimit-Reset:
              schema:
                type: string
              description: Seconds until the current route bucket resets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-hollyhr-domain-capabilities:
        - settings.organisation.manage
  /organisation/locations:
    get:
      operationId: listOrganisationLocations
      tags:
        - Organisation
      summary: List active organisation locations
      description: Lists active work locations for the authenticated organisation. Locations are
        organisation-owned office/worksite records, not employee home addresses.
      security:
        - ApiKeyAuth: []
      x-required-scope: organisation:read
      responses:
        "200":
          description: Active organisation locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationLocationList"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, unknown, revoked, or expired API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing scope or plan entitlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited. Responses include Retry-After and rate-limit metadata where available.
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying the request.
            RateLimit-Limit:
              schema:
                type: string
              description: Current route bucket limit.
            RateLimit-Remaining:
              schema:
                type: string
              description: Requests remaining in the current route bucket window.
            RateLimit-Reset:
              schema:
                type: string
              description: Seconds until the current route bucket resets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-hollyhr-domain-capabilities:
        - settings.workplace.manage
  /people:
    get:
      operationId: listPeople
      tags:
        - People
      summary: List people
      description: Lists people in the authenticated organisation, including ended people. Use
        sort=updated_at_desc for polling integrations that must receive the most recently changed
        records first. The projection intentionally includes work_email as an operational
        account/contact identifier for integrations, but excludes personal email, home contact data,
        date of birth, demographics, compensation, bank, tax/government identifiers, and avatar
        URLs/bytes.
      security:
        - ApiKeyAuth: []
      x-required-scope: people:read
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          required: false
          name: limit
          in: query
        - schema:
            type: string
            minLength: 1
          required: false
          name: cursor
          in: query
        - schema:
            type: string
            minLength: 2
            maxLength: 120
          required: false
          name: search
          in: query
        - schema:
            type: string
            format: date-time
          required: false
          name: updated_since
          in: query
        - schema:
            type: string
            enum:
              - updated_at_desc
          required: false
          name: sort
          in: query
      responses:
        "200":
          description: A cursor page of people.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, malformed, unknown, revoked, or expired API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
